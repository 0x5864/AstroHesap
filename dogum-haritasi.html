<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260331-favicon-2" />
    <title>AstroHesap | Doğum Haritası</title>
    <meta
      name="description"
      content="Detaylı doğum haritası için çember harita, temel eksen, kişisel gezegen tablosu ve 12 ev dağılımını tek ekranda incele."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260403-birth-main-26" />
    <script defer src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script defer src="astro-tools.js?v=20260403-birth-main-26"></script>
  </head>
  <body class="tool-page birth3-page" data-page="birth-chart-3">
    <div class="sky-noise"></div>
    <div class="sky-glow sky-glow-left"></div>
    <div class="sky-glow sky-glow-right"></div>

    <header class="global-header-band">
      <nav class="topbar global-topbar" aria-label="Ana gezinme">
        <a class="brand" href="index.html" aria-label="AstroHesap ana sayfa">
          <span class="brand-wordmark">
            <span class="brand-wordmark-accent">astro</span><span class="brand-wordmark-rest">hesap</span>
          </span>
        </a>

        <form class="header-search" action="index.html" method="get" role="search" aria-label="Araç ara">
          <label class="visually-hidden" for="toolSearchInputBirth3">Astro araç ara</label>
          <input
            id="toolSearchInputBirth3"
            class="header-search-input"
            type="search"
            name="q"
            placeholder="Araç, konu ya da burç ara"
            autocomplete="off"
          />
          <button class="header-search-btn" type="submit">Ara</button>
        </form>
      </nav>
    </header>

    <main class="tool-main tool-main-extended">
      <section class="birth3-layout">
        <article class="tool-card birth3-form-card">
          <div class="tool-card-head">
            <div>
              <h2>Doğum bilgileri</h2>
            </div>
          </div>

          <form id="birthChartThreeForm" class="tool-form seek-form" aria-label="Doğum haritası formu">
            <div class="tool-form-grid">
              <label class="tool-field">
                <span>Doğum tarihi</span>
                <input name="birthDate" type="date" required value="1958-10-10" />
              </label>

              <label class="tool-field">
                <span>Doğum saati</span>
                <input name="birthTime" type="time" required value="13:30" />
              </label>
            </div>

            <label class="seek-checkline sun-sign-inline-check">
              <input name="unknownTime" type="checkbox" />
              <span>Doğum saati bilinmiyor</span>
            </label>

            <div class="tool-form-grid tool-form-grid-3">
              <label class="tool-field">
                <span>İl</span>
                <select name="city" data-birth3-city data-default-city-label="İzmir">
                  <option value="">İl seçiniz</option>
                </select>
              </label>

              <label class="tool-field">
                <span>İlçe</span>
                <select name="district" data-birth3-district disabled>
                  <option value="">İlçe seçiniz</option>
                </select>
              </label>

              <label class="tool-field">
                <span>Mahalle</span>
                <select name="neighborhood" data-birth3-neighborhood disabled>
                  <option value="">Mahalle seçiniz</option>
                </select>
              </label>
            </div>

            <p class="tool-helper">
              İlçe seçince mahalleler otomatik gelir. Mahalle seçersen koordinatlar daha net bulunur.
            </p>

            <div class="tool-form-grid tool-form-grid-3">
              <label class="tool-field">
                <span>Enlem</span>
                <input name="latitude" type="number" step="0.0001" value="38.4193" />
              </label>

              <label class="tool-field">
                <span>Boylam</span>
                <input name="longitude" type="number" step="0.0001" value="27.1285" />
              </label>

              <label class="tool-field">
                <span>UTC farkı</span>
                <input name="timezoneOffset" type="number" step="0.5" value="3" />
              </label>
            </div>
          </form>
        </article>

        <article class="tool-card birth3-highlights-card">
          <div class="tool-card-head">
            <div>
              <h2>Hesaplama sonuçları</h2>
            </div>
          </div>
          <div class="birth3-highlight-grid">
            <article class="birth3-highlight-tile">
              <span>Güneş</span>
              <strong data-birth3-sun>-</strong>
            </article>
            <article class="birth3-highlight-tile">
              <span>Ay</span>
              <strong data-birth3-moon>-</strong>
            </article>
            <article class="birth3-highlight-tile">
              <span>Yükselen</span>
              <strong data-birth3-ascendant>-</strong>
            </article>
            <article class="birth3-highlight-tile">
              <span>MC</span>
              <strong data-birth3-midheaven>-</strong>
            </article>
          </div>
        </article>

        <article class="tool-card birth3-stage-card birth3-wide-card">
          <div class="tool-card-head">
            <div>
              <h2>Doğum haritası</h2>
            </div>
          </div>
          <div id="birthChartThreeResult" class="result-stack"></div>
        </article>

        <article class="tool-card birth3-houses-card birth3-wide-card">
          <div class="tool-card-head">
            <div>
              <h2>12 Ev yerleşimleri</h2>
            </div>
          </div>
          <div data-birth3-house-grid></div>
        </article>
      </section>
    </main>
  </body>
</html>
