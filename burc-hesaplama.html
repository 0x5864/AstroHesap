<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260331-favicon-2" />
    <title>AstroHesap | Burç Hesaplama</title>
    <meta
      name="description"
      content="Doğum tarihine göre güneş burcunu öğren, tarih aralığını, elementini ve temel karakter tonunu tek ekranda gör."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260404-search-dock-1" />
    <script defer src="astro-tools.js?v=20260404-search-dock-1"></script>
  </head>
  <body class="tool-page sun-sign-page" data-page="sun-sign-calculator">
    <div class="sky-noise"></div>
    <div class="sky-glow sky-glow-left"></div>
    <div class="sky-glow sky-glow-right"></div>

    <header class="global-header-band">
      <nav class="topbar global-topbar" aria-label="Ana gezinme">
        <a class="brand" href="index.html" aria-label="AstroHesap ana sayfa">
          <span class="brand-wordmark">
            <span class="brand-wordmark-accent">astro</span><span class="brand-wordmark-rest">hesap</span>
          </span>
        </a>

        <form class="header-search" action="index.html" method="get" role="search" aria-label="Araç ara">
          <label class="visually-hidden" for="toolSearchInputSunSign">Astro araç ara</label>
          <input
            id="toolSearchInputSunSign"
            class="header-search-input"
            type="search"
            name="q"
            placeholder="Araç, konu ya da burç ara"
            autocomplete="off"
          />
          <button class="header-search-btn" type="submit">Ara</button>
        </form>
      </nav>
    </header>

    <main class="tool-main tool-main-extended">
      <section class="sun-sign-page-heading" aria-label="Sayfa başlığı">
        <h1>Burç Hesaplama</h1>
      </section>

      <section class="sun-sign-shell">
        <article class="tool-card sun-sign-result-card">
          <div class="tool-card-head">
            <div>
              <h2>Hesaplama Sonucu</h2>
            </div>
          </div>
          <div id="sunSignResult" class="result-stack"></div>
        </article>

        <article class="tool-card birth-form-card sun-sign-form-card">
          <div class="tool-card-head">
            <div>
              <h2>Doğum bilgileri</h2>
            </div>
          </div>

          <form id="sunSignForm" class="tool-form seek-form">
            <section class="seek-section">
              <div class="tool-form-grid">
                <label class="tool-field">
                  <span>Doğum tarihi</span>
                  <input name="birthDate" type="date" />
                </label>

                <label class="tool-field">
                  <span>Doğum saati</span>
                  <input name="birthTime" type="time" value="12:00" />
                </label>
              </div>

              <label class="seek-checkline sun-sign-inline-check">
                <input name="unknownTime" type="checkbox" />
                <span>Doğum saati bilinmiyor</span>
              </label>

              <div class="tool-form-grid tool-form-grid-3">
                <label class="tool-field">
                  <span>İl</span>
                  <select name="city" data-location-city data-default-city-label="İstanbul"></select>
                </label>

                <label class="tool-field">
                  <span>İlçe</span>
                  <select name="district" data-location-district disabled>
                    <option value="">İlçe seçiniz</option>
                  </select>
                </label>

                <label class="tool-field">
                  <span>Mahalle</span>
                  <select name="neighborhood" data-location-neighborhood disabled>
                    <option value="">Mahalle seçiniz</option>
                  </select>
                </label>
              </div>

              <p class="tool-helper">
                İlçe seçince mahalleler otomatik gelir. Mahalle seçersen koordinatlar daha net bulunur.
              </p>

              <div class="tool-form-grid tool-form-grid-3">
                <label class="tool-field">
                  <span>Enlem</span>
                  <input name="latitude" type="number" step="0.0001" value="41.0082" />
                </label>

                <label class="tool-field">
                  <span>Boylam</span>
                  <input name="longitude" type="number" step="0.0001" value="28.9784" />
                </label>

                <label class="tool-field">
                  <span>UTC farkı</span>
                  <input name="timezoneOffset" type="number" step="0.5" value="3" />
                </label>
              </div>

            </section>
          </form>
        </article>
      </section>

    </main>
  </body>
</html>
