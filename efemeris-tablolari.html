<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260331-favicon-2" />
    <title>AstroHesap | Efemeris Tabloları</title>
    <meta
      name="description"
      content="Efemeris tabloları ekranında ay sekmeleri, yıl arşivi ve günlük gezegen kolonlarını Astro-Seek benzeri geniş tablo akışıyla incele."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260331-2145" />
    <style>
      .ephemeris-inline-primary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 148px));
        gap: 0.55rem;
        justify-content: start;
      }

      .ephemeris-inline-secondary {
        display: grid;
        grid-template-columns: minmax(0, 120px);
        gap: 0.55rem;
        justify-content: start;
      }

      .ephemeris-compact-field {
        gap: 0.22rem;
      }

      .ephemeris-compact-field span {
        font-size: 0.72rem;
        color: #4f5c69;
      }

      .ephemeris-compact-field select {
        min-height: 32px;
        padding: 0.2rem 0.45rem;
        border: 1px solid #b8c8dc;
        background: #ffffff;
        color: #263341;
        font-size: 0.76rem;
      }

      #ephemerisHeading {
        font-size: clamp(1.2rem, 1.95vw, 1.58rem);
        margin-bottom: 0.08rem;
      }

      #ephemerisArchiveHeading {
        font-size: clamp(1.2rem, 1.95vw, 1.58rem);
      }

      #ephemerisSubheading {
        margin-top: 0;
      }
    </style>
    <script defer src="astro-tools.js?v=20260401-profile-1"></script>
  </head>
  <body class="tool-page" data-page="ephemeris-tables">
    <div class="sky-noise"></div>
    <div class="sky-glow sky-glow-left"></div>
    <div class="sky-glow sky-glow-right"></div>

    <header class="global-header-band">
      <nav class="topbar global-topbar" aria-label="Ana gezinme">
        <a class="brand" href="index.html" aria-label="AstroHesap ana sayfa">
          <span class="brand-wordmark">
            <span class="brand-wordmark-accent">astro</span><span class="brand-wordmark-rest">hesap</span>
          </span>
        </a>

        <form class="header-search" action="index.html" method="get" role="search" aria-label="Araç ara">
          <label class="visually-hidden" for="toolSearchInputEphemeris">Astro araç ara</label>
          <input
            id="toolSearchInputEphemeris"
            class="header-search-input"
            type="search"
            name="q"
            placeholder="Araç, konu ya da burç ara"
            autocomplete="off"
          />
          <button class="header-search-btn" type="submit">Ara</button>
        </form>
      </nav>
    </header>

    <main class="tool-main tool-main-extended">
      <form id="ephemerisForm" class="ephemeris-state-form">
        <input id="ephemerisMonth" name="month" type="hidden" value="" />
      </form>

      <section class="tool-card tool-result-card ephemeris-result-card">
        <div class="tool-card-head">
          <h2 id="ephemerisHeading">Efemeris Tabloları</h2>
          <p class="tool-note" id="ephemerisSubheading">
            Günlük efemeris akışı 00:00 [UT/GMT] baz alınarak tabloya dökülür.
          </p>
        </div>

        <section class="ephemeris-nav-card" aria-label="Efemeris gezinme">
          <div class="ephemeris-year-nav" id="ephemerisYearNav" aria-label="Yıl geçişi"></div>
        </section>

        <div id="ephemerisResult" class="result-stack"></div>
      </section>

      <section class="tool-card ephemeris-archive-card">
        <div class="tool-card-head">
          <div>
            <h2 id="ephemerisArchiveHeading">Efemeris Tabloları 1800-2100</h2>
          </div>
        </div>

        <div id="ephemerisArchive" class="ephemeris-year-archive" aria-label="Efemeris yıl arşivi"></div>
      </section>
    </main>
  </body>
</html>
