<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260331-favicon-2" />
    <title>AstroHesap | Giriş Yap</title>
    <meta
      name="description"
      content="AstroHesap hesabına giriş yap veya yeni kayıt oluştur."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260404-auth-fix-1" />
    <script defer src="astro-tools.js?v=20260404-auth-fix-1"></script>
    <script defer src="app.js?v=20260404-auth-fix-1"></script>
    <script defer src="auth-local.js?v=20260404-auth-fix-2"></script>
  </head>
  <body class="tool-page auth-entry-page" data-page="auth-entry">
    <div class="sky-noise"></div>
    <div class="sky-glow sky-glow-left"></div>
    <div class="sky-glow sky-glow-right"></div>

    <header class="global-header-band">
      <nav class="topbar global-topbar" aria-label="Ana gezinme">
        <a class="brand" href="index.html" aria-label="AstroHesap ana sayfa">
          <span class="brand-wordmark">
            <span class="brand-wordmark-accent">astro</span><span class="brand-wordmark-rest">hesap</span>
          </span>
        </a>
      </nav>
    </header>

    <main class="tool-main tool-main-extended auth-entry-main">
      <section class="auth-entry-shell">
        <h1>Giriş yap</h1>
        <p>Hesabına gir ya da yeni bir hesap aç.</p>
      </section>

      <div class="auth-dialog auth-dialog-page" role="dialog" aria-modal="false" aria-labelledby="authDialogTitle">
        <div class="auth-tabs" role="tablist" aria-label="Hesap sekmeleri">
          <button
            class="auth-tab is-active"
            id="authLoginTab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="authLoginPanel"
            data-auth-tab="login"
            onclick="window.AstroHesapAuthEntry?.setTab?.('login')"
          >
            Giriş yap
          </button>
          <button
            class="auth-tab"
            id="authRegisterTab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="authRegisterPanel"
            data-auth-tab="register"
            onclick="window.AstroHesapAuthEntry?.setTab?.('register')"
          >
            Kayıt ol
          </button>
        </div>

        <section
          class="auth-panel is-active"
          id="authLoginPanel"
          role="tabpanel"
          aria-labelledby="authLoginTab"
          data-auth-panel="login"
        >
          <form class="auth-form" id="authLoginForm" autocomplete="on">
            <label class="auth-field">
              <span>E-posta</span>
              <div class="auth-input-wrap">
                <input name="email" type="email" autocomplete="email" />
                <span class="auth-input-side" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M5 3h14a1 1 0 0 1 1 1v8.2a7.8 7.8 0 0 0-3.2-.2V6.1L12 9.2 7.2 6.1V18h6.1a7.5 7.5 0 0 0 .6 3H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 4.4L6.3 4.8h11.4Z" />
                    <path d="M18 13a5 5 0 1 1-5 5v-5Z" opacity=".35" />
                  </svg>
                </span>
              </div>
            </label>

            <label class="auth-field">
              <span>Şifre</span>
              <div class="auth-input-wrap">
                <input name="password" type="password" autocomplete="current-password" data-password-input />
                <button class="auth-eye-btn" type="button" aria-label="Şifreyi göster veya gizle" data-password-toggle>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.53 2.47a.75.75 0 1 0-1.06 1.06l2.18 2.18A12.9 12.9 0 0 0 1.39 12a13.72 13.72 0 0 0 4.19 4.56A10.89 10.89 0 0 0 12 18.75a10.52 10.52 0 0 0 4.58-1L20.47 21.6a.75.75 0 0 0 1.06-1.06Zm7.2 7.2 3.6 3.6A2.83 2.83 0 0 1 12 14a3 3 0 0 1-3-3 2.83 2.83 0 0 1 .73-1.33Zm1.07-4.42A10.52 10.52 0 0 1 12 5.25 10.89 10.89 0 0 1 18.42 7.4 13.72 13.72 0 0 1 22.61 12a13.77 13.77 0 0 1-3.32 3.84l-1.09-1.09A11.82 11.82 0 0 0 20.83 12 11.94 11.94 0 0 0 17.57 8.7a9.45 9.45 0 0 0-4.7-1.95Z" />
                  </svg>
                </button>
              </div>
            </label>

            <div class="auth-row">
              <label class="auth-check">
                <input name="rememberEmail" type="checkbox" checked />
                <span>E-postamı hatırla</span>
              </label>

              <button class="auth-link-btn" type="button" data-auth-forgot>Şifremi unuttum</button>
            </div>

            <p class="auth-status" data-auth-status="login" hidden></p>

            <div class="auth-actions">
              <button class="auth-submit-btn" type="submit">Giriş yap</button>
            </div>

            <button class="auth-inline-switch" type="button" data-auth-switch="register">
              Hesabın yok mu? Kayıt ol
            </button>
          </form>
        </section>

        <section
          class="auth-panel"
          id="authRegisterPanel"
          role="tabpanel"
          aria-labelledby="authRegisterTab"
          data-auth-panel="register"
          hidden
        >
          <form class="auth-form" id="authRegisterForm" autocomplete="on">
            <label class="auth-field">
              <span>Ad Soyad</span>
              <input name="fullName" type="text" placeholder="Adın ve soyadın" autocomplete="name" />
            </label>

            <label class="auth-field">
              <span>E-posta</span>
              <input name="email" type="email" placeholder="ornek@mail.com" autocomplete="email" />
            </label>

            <label class="auth-field">
              <span>Şifre</span>
              <input name="password" type="password" placeholder="Şifre oluştur" autocomplete="new-password" />
            </label>

            <label class="auth-field">
              <span>Şifre tekrar</span>
              <input name="passwordRepeat" type="password" placeholder="Şifreni tekrar yaz" autocomplete="new-password" />
            </label>

            <label class="auth-check auth-check-stack">
              <input name="termsAccepted" type="checkbox" checked />
              <span>Kullanım koşulları ve gizlilik metnini okudum.</span>
            </label>

            <p class="auth-status" data-auth-status="register" hidden></p>

            <div class="auth-actions">
              <button class="auth-submit-btn" type="submit">Kayıt ol</button>
            </div>

            <button class="auth-inline-switch" type="button" data-auth-switch="login">
              Zaten hesabın var mı? Giriş yap
            </button>
          </form>
        </section>
      </div>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const tabs = Array.from(document.querySelectorAll("[data-auth-tab]"));
        const panels = Array.from(document.querySelectorAll("[data-auth-panel]"));
        const switchButtons = Array.from(document.querySelectorAll("[data-auth-switch]"));
        const loginForm = document.querySelector("#authLoginForm");
        const registerForm = document.querySelector("#authRegisterForm");
        const forgotButton = document.querySelector("[data-auth-forgot]");
        const loginStatus = document.querySelector('[data-auth-status="login"]');
        const registerStatus = document.querySelector('[data-auth-status="register"]');
        const isNativeShell = (() => {
          try {
            return Boolean(window.Capacitor?.isNativePlatform?.() ?? window.Capacitor?.isNative);
          } catch (_error) {
            return false;
          }
        })();

        const STORAGE_KEYS = {
          users: "astrohesap-users",
          session: "astrohesap-session",
          rememberedEmail: "astrohesap-remembered-email",
        };

        const setTab = (tabKey) => {
          tabs.forEach((tab) => {
            const isActive = tab.getAttribute("data-auth-tab") === tabKey;
            tab.classList.toggle("is-active", isActive);
            tab.setAttribute("aria-selected", String(isActive));
          });

          panels.forEach((panel) => {
            const isActive = panel.getAttribute("data-auth-panel") === tabKey;
            panel.hidden = !isActive;
            panel.classList.toggle("is-active", isActive);
          });
        };

        const setStatus = (node, message, type = "") => {
          if (!(node instanceof HTMLElement)) {
            return;
          }

          if (!message) {
            node.hidden = true;
            node.textContent = "";
            node.classList.remove("is-error", "is-success");
            return;
          }

          node.hidden = false;
          node.textContent = message;
          node.classList.toggle("is-error", type === "error");
          node.classList.toggle("is-success", type === "success");
        };

        const getStoredUsers = () => {
          try {
            const parsed = JSON.parse(window.localStorage.getItem(STORAGE_KEYS.users) ?? "[]");
            return Array.isArray(parsed) ? parsed : [];
          } catch (_error) {
            return [];
          }
        };

        const setStoredUsers = (users) => {
          window.localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(users));
        };

        const setSession = (session) => {
          window.localStorage.setItem(STORAGE_KEYS.session, JSON.stringify(session));
        };

        const setRememberedEmail = (email) => {
          if (email) {
            window.localStorage.setItem(STORAGE_KEYS.rememberedEmail, email);
            return;
          }

          window.localStorage.removeItem(STORAGE_KEYS.rememberedEmail);
        };

        const rememberedEmail = window.localStorage.getItem(STORAGE_KEYS.rememberedEmail) ?? "";
        const loginEmailInput = loginForm?.querySelector('input[name="email"]');
        if (rememberedEmail && loginEmailInput instanceof HTMLInputElement) {
          loginEmailInput.value = rememberedEmail;
        }

        window.AstroHesapAuthEntry = {
          setTab,
        };

        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            setStatus(loginStatus, "");
            setStatus(registerStatus, "");
            setTab(tab.getAttribute("data-auth-tab") || "login");
          });
        });

        switchButtons.forEach((button) => {
          button.addEventListener("click", () => {
            setStatus(loginStatus, "");
            setStatus(registerStatus, "");
            setTab(button.getAttribute("data-auth-switch") || "register");
          });
        });

        if (!isNativeShell) {
          return;
        }

        const handleNativeLogin = () => {
          if (!(loginForm instanceof HTMLFormElement)) {
            return;
          }

          const formData = new FormData(loginForm);
          const email = String(formData.get("email") ?? "").trim().toLocaleLowerCase("tr-TR");
          const password = String(formData.get("password") ?? "");
          const rememberEmail = formData.has("rememberEmail");

          if (!email || !password) {
            setStatus(loginStatus, "E-posta ve şifre alanlarını doldur.", "error");
            return;
          }

          const user = getStoredUsers().find((entry) => entry.email === email);
          if (!user || user.password !== password) {
            setStatus(loginStatus, "E-posta ya da şifre eşleşmedi.", "error");
            return;
          }

          setSession({
            email: user.email,
            fullName: user.fullName,
            loggedAt: new Date().toISOString(),
          });
          setRememberedEmail(rememberEmail ? email : "");
          setStatus(loginStatus, "Giriş başarılı. Ana sayfaya dönülüyor.", "success");
          window.setTimeout(() => {
            window.location.href = "index.html";
          }, 320);
        };

        const handleNativeRegister = () => {
          if (!(registerForm instanceof HTMLFormElement)) {
            return;
          }

          const formData = new FormData(registerForm);
          const fullName = String(formData.get("fullName") ?? "").trim();
          const email = String(formData.get("email") ?? "").trim().toLocaleLowerCase("tr-TR");
          const password = String(formData.get("password") ?? "");
          const passwordRepeat = String(formData.get("passwordRepeat") ?? "");
          const termsAccepted = formData.has("termsAccepted");

          if (!fullName || !email || !password || !passwordRepeat) {
            setStatus(registerStatus, "Tüm alanları doldur.", "error");
            return;
          }

          if (password.length < 6) {
            setStatus(registerStatus, "Şifre en az 6 karakter olmalı.", "error");
            return;
          }

          if (password !== passwordRepeat) {
            setStatus(registerStatus, "Şifreler aynı değil.", "error");
            return;
          }

          if (!termsAccepted) {
            setStatus(registerStatus, "Devam etmek için onay kutusunu işaretle.", "error");
            return;
          }

          const users = getStoredUsers();
          if (users.some((entry) => entry.email === email)) {
            setStatus(registerStatus, "Bu e-posta ile kayıt zaten var.", "error");
            return;
          }

          users.push({
            fullName,
            email,
            password,
            createdAt: new Date().toISOString(),
          });
          setStoredUsers(users);
          setRememberedEmail(email);
          setSession({
            email,
            fullName,
            loggedAt: new Date().toISOString(),
          });
          setStatus(registerStatus, "Kayıt tamamlandı. Ana sayfaya dönülüyor.", "success");
          window.setTimeout(() => {
            window.location.href = "index.html";
          }, 320);
        };

        const handleNativeForgot = () => {
          if (!(loginForm instanceof HTMLFormElement)) {
            return;
          }

          const emailInput = loginForm.querySelector('input[name="email"]');
          const email =
            emailInput instanceof HTMLInputElement
              ? emailInput.value.trim().toLocaleLowerCase("tr-TR")
              : "";

          if (!email) {
            setStatus(loginStatus, "Önce e-posta alanını doldur.", "error");
            return;
          }

          const user = getStoredUsers().find((entry) => entry.email === email);
          if (!user) {
            setStatus(loginStatus, "Bu e-posta ile kayıt bulunamadı.", "error");
            return;
          }

          setStatus(loginStatus, "Hesap bulundu. Giriş için kayıtlı şifreni kullan.", "success");
        };

        loginForm?.addEventListener(
          "submit",
          (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            handleNativeLogin();
          },
          true,
        );

        registerForm?.addEventListener(
          "submit",
          (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            handleNativeRegister();
          },
          true,
        );

        forgotButton?.addEventListener(
          "click",
          (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            handleNativeForgot();
          },
          true,
        );
      });
    </script>
  </body>
</html>
