<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260331-favicon-2" />
    <title>AstroHesap | Ay Takvimi</title>
    <meta
      name="description"
      content="Seçilen ay için yeni ay, dolunay ve çeyrek fazları AstroHesap ile listele."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260404-search-dock-1" />
    <script>
      (() => {
        const version = "20260402-moon-calendar-months-4";
        const url = new URL(window.location.href);
        if (!url.searchParams.get("v")) {
          url.searchParams.set("v", version);
          window.location.replace(url.toString());
        }
      })();
    </script>
    <script defer src="astro-tools.js?v=20260404-search-dock-1"></script>
  </head>
  <body class="tool-page moon-calendar-page" data-page="moon-calendar">
    <div class="sky-noise"></div>
    <div class="sky-glow sky-glow-left"></div>
    <div class="sky-glow sky-glow-right"></div>

    <header class="global-header-band">
      <nav class="topbar global-topbar" aria-label="Ana gezinme">
        <a class="brand" href="index.html" aria-label="AstroHesap ana sayfa">
          <span class="brand-wordmark">
            <span class="brand-wordmark-accent">astro</span><span class="brand-wordmark-rest">hesap</span>
          </span>
        </a>

        <form class="header-search" action="index.html" method="get" role="search" aria-label="Araç ara">
          <label class="visually-hidden" for="toolSearchInputMoon">Astro araç ara</label>
          <input
            id="toolSearchInputMoon"
            class="header-search-input"
            type="search"
            name="q"
            placeholder="Araç, konu ya da burç ara"
            autocomplete="off"
          />
          <button class="header-search-btn" type="submit">Ara</button>
        </form>
      </nav>
    </header>

    <main class="tool-main">
      <section class="hero-content tool-hero">
        <h1>Ay Takvimi</h1>
      </section>

      <section class="tool-layout">
        <article class="tool-card">
          <div class="tool-card-head">
            <h2>Ay seçimi</h2>
          </div>

          <form id="moonCalendarForm" class="tool-form">
            <div class="tool-form-grid">
              <div class="tool-field">
                <span>Ay</span>
                <div class="moon-calendar-month-grid">
                  <select id="moonMonth" name="month" required>
                    <option value="01">Ocak</option>
                    <option value="02">Şubat</option>
                    <option value="03">Mart</option>
                    <option value="04">Nisan</option>
                    <option value="05">Mayıs</option>
                    <option value="06">Haziran</option>
                    <option value="07">Temmuz</option>
                    <option value="08">Ağustos</option>
                    <option value="09">Eylül</option>
                    <option value="10">Ekim</option>
                    <option value="11">Kasım</option>
                    <option value="12">Aralık</option>
                  </select>
                  <input id="moonYear" name="year" type="number" min="1900" max="2100" step="1" placeholder="Yıl" required />
                </div>
              </div>

              <label class="tool-field">
                <span>Takvim notu</span>
                <input id="moonFocus" name="focus" type="text" placeholder="Örnek: iş, ilişki, rutin" />
              </label>
            </div>

            <div class="tool-actions">
              <button class="tool-button" type="submit">Takvimi oluştur</button>
            </div>

            <p class="tool-note">
              Seçtiğin ay için ana ay fazlarını ve bugünkü fazı aynı ekranda gör.
            </p>
          </form>

        </article>

        <article class="tool-card tool-result-card">
          <div class="tool-card-head">
            <h2>Ay faz listesi</h2>
          </div>

          <div id="moonCalendarResult" class="result-stack"></div>
        </article>
      </section>
    </main>
  </body>
</html>
